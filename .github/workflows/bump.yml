name: Refresh dependency locks

# Resolve the targets declared in flake.nix/go.mod on CI. Review the resulting
# patch before committing; never auto-accept a failed content checksum.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  locks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Resolve declared dependencies
        run: |
          nix flake lock
          # Cap the go.mod directive at nixpkgs' pinned go version: the guest
          # agent is built by Nix (nix/guest.nix), not this runner's toolchain,
          # and a directive ahead of nixpkgs' go fails that build (seen in
          # practice: "go.mod requires go >= X; running go Y").
          nix_go=$(nix eval --raw 'nixpkgs#go.version')
          go mod tidy -go="${nix_go%.*}"
          git diff -- flake.lock go.mod go.sum > dependency-locks.patch
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-locks
          path: |
            dependency-locks.patch
            flake.lock
            go.mod
            go.sum
          if-no-files-found: error
          retention-days: 14
